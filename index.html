    <!-- Early data preload: fires critical Supabase requests in parallel with JS bundle
         to eliminate the JS→data chain that dominates LCP. Results are stashed on
         window.__ppPreload and consumed by React Query hooks. -->
    <script>
      (function () {
        var base = "https://zspmhkzosumopyfmlwvl.supabase.co/rest/v1/";
        var key = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpzcG1oa3pvc3Vtb3B5Zm1sd3ZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAzOTQ4NzQsImV4cCI6MjA4NTk3MDg3NH0.IJ8LtX2iLYCN_z110Upf6rz1hal1pjKM-12v5X82sow";
        var h = { apikey: key, authorization: "Bearer " + key, "accept-profile": "public" };
        function get(url) {
          return fetch(base + url, { headers: h, credentials: "omit" })
            .then(function (r) { return r.ok ? r.json() : null; })
            .catch(function () { return null; });
        }
        window.__ppPreload = {
          branding: get("site_branding?select=*"),
          // MUST match useCategories() shape/order so React Query consumes it
          categories: get("categories?select=*&order=sort_order.asc"),
          settings: get("site_settings?select=id,typography,meta_pixel_id,meta_pixel_enabled,meta_test_mode,meta_advanced_matching,meta_ecommerce_events_enabled,meta_capi_enabled&limit=1"),
        };

        // Hero LCP preload from last-known branding (localStorage) — fires before React mounts
        try {
          var raw = localStorage.getItem("pp_branding_v1");
          if (raw) {
            var parsed = JSON.parse(raw);
            var b = parsed && parsed.data;
            if (b) {
              var isDesktop = window.matchMedia && window.matchMedia("(min-width: 768px)").matches;
              var url = isDesktop ? (b.desktop_hero_url || b.mobile_hero_url) : (b.mobile_hero_url || b.desktop_hero_url);
              if (url) {
                var l = document.createElement("link");
                l.rel = "preload"; l.as = "image"; l.href = url;
                l.setAttribute("fetchpriority", "high");
                document.head.appendChild(l);
              }
            }
          }
        } catch (e) { /* ignore */ }
      })();
    </script>
