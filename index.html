  <!-- Critical CSS: paints layout shell before main bundle arrives -->
  <style>
    html,body{margin:0;padding:0;background:#fff;color:#2f2f2f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:13px;line-height:1.4}
    #root{min-height:100vh}
    .boot-shell{min-height:100vh;display:flex;flex-direction:column}
    .boot-announce{background:#2f2f2f;color:#fff;text-align:center;padding:8px 0;font-size:11px;letter-spacing:.15em;font-weight:500}
    .boot-header{height:64px;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:center;font-weight:700;letter-spacing:.1em;font-size:18px}
    .boot-main{flex:1;padding:24px 16px;display:grid;gap:12px}
    .boot-box{background:linear-gradient(90deg,#f0f0f0 0%,#e6e6e6 50%,#f0f0f0 100%);background-size:200% 100%;animation:bootshim 1.2s ease-in-out infinite;border-radius:2px}
    .boot-hero{height:240px}
    .boot-row{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
    .boot-tile{aspect-ratio:1/1}
    @media(min-width:768px){.boot-row{grid-template-columns:repeat(4,1fr)}.boot-hero{height:420px}}
    @keyframes bootshim{0%{background-position:200% 0}100%{background-position:-200% 0}}
    @media(max-width:767px){.boot-box{animation:none}}
  </style>
