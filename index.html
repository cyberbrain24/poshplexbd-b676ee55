  <body>
    <style>
      /* Inline boot shell — paints before JS/CSS arrive. Removed by React on first render. */
      #boot-shell{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:#2f2f2f;background:#fff;min-height:100vh}
      #boot-shell .bs-announce{height:28px;background:#2f2f2f}
      #boot-shell .bs-header{height:56px;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between;padding:0 16px}
      #boot-shell .bs-box{background:#f1f1f1;border-radius:4px}
      #boot-shell .bs-logo{width:110px;height:18px}
      #boot-shell .bs-icon{width:22px;height:22px}
      #boot-shell .bs-hero{width:100%;aspect-ratio:3/1;background:#f1f1f1}
      #boot-shell .bs-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:18px 16px}
      #boot-shell .bs-tile{aspect-ratio:1/1;background:#f1f1f1;border-radius:2px}
      @media (min-width:768px){
        #boot-shell .bs-header{height:64px;padding:0 32px}
        #boot-shell .bs-hero{aspect-ratio:4/1}
        #boot-shell .bs-grid{grid-template-columns:repeat(4,1fr);gap:24px;padding:24px 32px}
      }
    </style>
    <div id="root">
      <div id="boot-shell" aria-hidden="true">
        <div class="bs-announce"></div>
        <div class="bs-header">
          <div class="bs-box bs-icon"></div>
          <div class="bs-box bs-logo"></div>
          <div class="bs-box bs-icon"></div>
        </div>
        <div class="bs-hero"></div>
        <div class="bs-grid">
          <div class="bs-tile"></div><div class="bs-tile"></div>
          <div class="bs-tile"></div><div class="bs-tile"></div>
          <div class="bs-tile"></div><div class="bs-tile"></div>
        </div>
      </div>
    </div>
